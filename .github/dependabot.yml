version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/JustyBase.NetezzaDriver"
      - "/src/JustyBase.NetezzaDriver.Tests"
      - "/src/JustyBase.NetezzaDriver.Benchmarks"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
